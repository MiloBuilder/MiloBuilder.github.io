<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Angel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0d1c;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* ============ SKY LAYER ============ */
  .sky {
    position: absolute;
    inset: -10%;
    background-image: url("sky.png");
    background-size: cover;
    background-position: center;
    will-change: transform;
    animation: skyDrift 40s ease-in-out infinite alternate;
    filter: saturate(1.15) contrast(1.06) brightness(1.04);
  }

  @keyframes skyDrift {
    0%   { transform: scale(1.16) translate3d(-1.5%, 1.5%, 0); }
    50%  { transform: scale(1.24) translate3d(1.5%, -1.2%, 0); }
    100% { transform: scale(1.18) translate3d(0.8%, -2%, 0); }
  }

  /* clouds drifting in front, near the bottom */
  .clouds {
    position: absolute;
    left: -20%;
    right: -20%;
    bottom: -10%;
    height: 55%;
    background:
      radial-gradient(60% 100% at 20% 100%, rgba(255,250,250,0.55), rgba(255,255,255,0) 70%),
      radial-gradient(70% 100% at 55% 100%, rgba(255,228,240,0.45), rgba(255,255,255,0) 72%),
      radial-gradient(65% 100% at 85% 100%, rgba(255,248,235,0.50), rgba(255,255,255,0) 70%);
    filter: blur(28px);
    pointer-events: none;
    animation: cloudRoll 30s ease-in-out infinite alternate;
  }
  @keyframes cloudRoll {
    0%   { transform: translate3d(-4%, 2%, 0) scale(1.02); opacity: 0.75; }
    100% { transform: translate3d(4%, -1%, 0) scale(1.10); opacity: 0.95; }
  }

  /* ============ SUN BLOOM ============ */
  .sun {
    position: absolute;
    left: 44%;
    top: 47%;
    width: 46vmax;
    height: 46vmax;
    margin: -23vmax 0 0 -23vmax;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.85) 0%,
      rgba(255,246,214,0.45) 20%,
      rgba(255,214,170,0.16) 42%,
      rgba(255,255,255,0) 68%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: sunPulse 7s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1);    opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  /* extra ray that sweeps, brightening the skylight */
  .ray {
    position: absolute;
    left: 44%;
    top: 47%;
    width: 20vmax;
    height: 150vh;
    transform-origin: top center;
    translate: -50% 0;
    background: linear-gradient(to bottom,
      rgba(255,255,255,0.55),
      rgba(255,240,200,0.18) 55%,
      rgba(255,255,255,0) 100%);
    filter: blur(22px);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: raySway 16s ease-in-out infinite alternate;
  }
  @keyframes raySway {
    0%   { transform: rotate(-9deg);  opacity: 0.35; }
    50%  { transform: rotate(-1deg);  opacity: 0.75; }
    100% { transform: rotate(7deg);   opacity: 0.42; }
  }

  /* ============ ANGEL ============ */
  .angel-wrap {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    will-change: transform;
  }

  /* glow halo behind the figure */
  .angel-glow {
    position: absolute;
    width: 46vmin;
    height: 46vmin;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,240,220,0.40),
      rgba(255,215,190,0.16) 45%,
      rgba(255,255,255,0) 70%);
    filter: blur(18px);
    mix-blend-mode: screen;
    animation: glowBreath 6s ease-in-out infinite;
  }
  @keyframes glowBreath {
    0%, 100% { transform: scale(1);    opacity: 0.55; }
    50%      { transform: scale(1.12); opacity: 0.85; }
  }

  .angel {
    position: relative;
    height: 62vh;
    max-width: 88vw;
    object-fit: contain;
    filter:
      drop-shadow(0 0 18px rgba(255,238,220,0.55))
      drop-shadow(0 0 60px rgba(255,205,165,0.35))
      drop-shadow(0 18px 30px rgba(40,20,60,0.35));
    animation:
      float 8s ease-in-out infinite alternate,
      tilt 11s ease-in-out infinite alternate;
    transform-origin: 50% 60%;
    will-change: transform;
  }

  @keyframes float {
    0%   { translate: 0 -1.8vh; }
    100% { translate: 0 1.8vh; }
  }
  @keyframes tilt {
    0%   { rotate: -2.2deg; }
    100% { rotate: 2.2deg; }
  }

  /* ============ PARTICLES ============ */
  .motes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .mote {
    position: absolute;
    bottom: -8vh;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: rgba(255,251,240,0.95);
    box-shadow: 0 0 10px 3px rgba(255,243,220,0.60);
    opacity: 0;
    animation: rise var(--dur) linear var(--delay) infinite;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) scale(0.5); opacity: 0; }
    10%  { opacity: var(--op); }
    50%  { transform: translate3d(var(--sway), -55vh, 0) scale(1); }
    88%  { opacity: var(--op); }
    100% { transform: translate3d(calc(var(--sway) * -1), -118vh, 0) scale(0.4); opacity: 0; }
  }

  /* ============ NAME PLATE ============ */
  .plate {
    position: absolute;
    left: 50%;
    bottom: 9vh;
    translate: -50% 0;
    padding: 1.05rem 3.2rem;
    border-radius: 14px;
    background:
      linear-gradient(160deg,
        rgba(18,24,52,0.55),
        rgba(28,34,70,0.42) 45%,
        rgba(70,55,110,0.48));
    border: 1px solid rgba(255,255,255,0.55);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.10) inset,
      0 10px 44px rgba(20,12,45,0.55),
      0 0 70px rgba(190,215,255,0.35);
    overflow: hidden;
    animation: plateIn 1.4s cubic-bezier(.2,.8,.2,1) 0.3s both,
               plateFloat 7s ease-in-out 1.7s infinite alternate;
  }

  /* light sweep inside the plate */
  .plate::before {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 45%;
    height: 100%;
    background: linear-gradient(100deg,
      rgba(255,255,255,0),
      rgba(255,255,255,0.45),
      rgba(255,255,255,0));
    transform: skewX(-18deg);
    animation: plateShine 5.5s ease-in-out 2s infinite;
  }

  @keyframes plateShine {
    0%, 60%  { left: -60%; }
    100%     { left: 130%; }
  }

  @keyframes plateIn {
    0%   { opacity: 0; transform: translateY(28px) scale(0.94); filter: blur(8px); }
    100% { opacity: 1; transform: translateY(0) scale(1);     filter: blur(0); }
  }

  @keyframes plateFloat {
    0%   { transform: translateY(0)     rotate(-0.35deg); }
    100% { transform: translateY(-9px)  rotate(0.35deg); }
  }

  .plate span {
    display: block;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1.6rem, 4.2vw, 3.1rem);
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: none;
    text-indent: 0.28em;
    color: #fff;
    text-shadow:
      0 0 12px rgba(255,255,255,0.85),
      0 0 34px rgba(180,215,255,0.75),
      0 0 70px rgba(140,180,255,0.45);
    animation: textGlow 4.5s ease-in-out infinite;
  }

  @keyframes textGlow {
    0%, 100% { opacity: 0.92; text-shadow: 0 0 12px rgba(255,255,255,0.8), 0 0 32px rgba(180,215,255,0.7), 0 0 64px rgba(140,180,255,0.4); }
    50%      { opacity: 1;    text-shadow: 0 0 18px rgba(255,255,255,1),   0 0 48px rgba(200,225,255,0.9), 0 0 96px rgba(160,195,255,0.6); }
  }

  /* ============ GRADING ============ */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 42%, rgba(24,10,40,0.42) 100%),
      linear-gradient(to bottom, rgba(30,60,140,0.10), rgba(255,180,200,0.06) 65%, rgba(40,15,50,0.35));
    mix-blend-mode: multiply;
  }

  .sheen {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg,
      rgba(255,255,255,0) 42%,
      rgba(255,255,255,0.16) 50%,
      rgba(255,255,255,0) 58%);
    background-size: 300% 300%;
    mix-blend-mode: overlay;
    animation: sheenMove 13s ease-in-out infinite;
  }
  @keyframes sheenMove {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="sky"></div>
    <div class="clouds"></div>
    <div class="sun"></div>
    <div class="ray"></div>

    <div class="angel-wrap" id="angelWrap">
      <div class="angel-glow"></div>
      <img class="angel" src="angel.png" alt="falling angel">
    </div>

    <div class="motes" id="motes"></div>

    <div class="plate"><span>Galactic</span></div>

    <div class="vignette"></div>
    <div class="sheen"></div>

    <audio id="bgm" src="callme.mp3" loop preload="auto"></audio>
  </div>

<script>
  // sparkle motes
  const motes = document.getElementById('motes');
  for (let i = 0; i < 50; i++) {
    const m = document.createElement('div');
    m.className = 'mote';
    m.style.left = (Math.random() * 100).toFixed(2) + '%';
    m.style.setProperty('--s', (Math.random() * 4 + 1.5).toFixed(2) + 'px');
    m.style.setProperty('--dur', (Math.random() * 12 + 10).toFixed(1) + 's');
    m.style.setProperty('--delay', (-Math.random() * 22).toFixed(1) + 's');
    m.style.setProperty('--op', (Math.random() * 0.6 + 0.25).toFixed(2));
    m.style.setProperty('--sway', (Math.random() * 8 - 4).toFixed(1) + 'vw');
    motes.appendChild(m);
  }

  // drifting feathers removed

  // ---- music: fades in on first interaction ----
  const bgm = document.getElementById('bgm');
  const VOLUME = 0.55;
  let fadeRAF = null;

  function fadeVolume(from, to, ms, done) {
    cancelAnimationFrame(fadeRAF);
    const t0 = performance.now();
    (function step(now) {
      const p = Math.min((now - t0) / ms, 1);
      bgm.volume = from + (to - from) * p;
      if (p < 1) fadeRAF = requestAnimationFrame(step);
      else if (done) done();
    })(t0);
  }

  function playMusic() {
    if (!bgm.paused) return;
    bgm.volume = 0;
    bgm.play().then(() => fadeVolume(0, VOLUME, 4000)).catch(() => {});
  }

  // browsers need a gesture, so the first tap/click/key anywhere starts it
  const kick = () => {
    playMusic();
    window.removeEventListener('pointerdown', kick);
    window.removeEventListener('keydown', kick);
  };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);

  // parallax layers
  const sky = document.querySelector('.sky');
  const wrap = document.getElementById('angelWrap');
  let tx = 0, ty = 0, sx = 0, sy = 0, ax = 0, ay = 0;

  window.addEventListener('mousemove', (e) => {
    tx = (e.clientX / window.innerWidth  - 0.5);
    ty = (e.clientY / window.innerHeight - 0.5);
  });

  function loop() {
    sx += (tx * 18 - sx) * 0.04;
    sy += (ty * 18 - sy) * 0.04;
    ax += (tx * 52 - ax) * 0.06;
    ay += (ty * 52 - ay) * 0.06;
    sky.style.translate   = `${sx}px ${sy}px`;
    wrap.style.translate  = `${ax}px ${ay}px`;
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
