<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Games</title>
<style>
:root {
    --bg: #05060a;
    --panel: rgba(12, 14, 29, .88);
    --panel-strong: rgba(17, 20, 39, .97);
    --purple: #8b5cf6;
    --cyan: #22d3ee;
    --muted: #a7aec4;
    --sidebar-width: 250px;
    --rail-width: 54px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: #fff; overflow: hidden;
}
button, input { font: inherit; }
button { color: inherit; }
#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: white; opacity: .45; transition: transform .18s ease-out;
}
header {
    height: 150px; position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 20px;
    background: linear-gradient(180deg, rgba(5,6,10,.9), rgba(5,6,10,.5));
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(139,92,246,.1);
}
h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -.04em;
    background: linear-gradient(100deg, #fff 10%, #b8a1ff 55%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(139,92,246,.2));
}
.controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; width: 100%; }
#search {
    width: min(320px, 65vw); padding: 11px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.09); outline: none;
    background: rgba(255,255,255,.055); color: #fff;
    transition: border-color .2s, background .2s, box-shadow .2s;
}
#search::placeholder { color: #858ba2; }
#search:focus { border-color: rgba(139,92,246,.8); background: rgba(255,255,255,.08); box-shadow: 0 0 0 3px rgba(139,92,246,.12); }
.sort-btn {
    padding: 10px 15px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.055);
    transition: background .2s, border-color .2s, transform .2s;
}
.sort-btn:hover { background: rgba(139,92,246,.18); border-color: rgba(139,92,246,.45); }
.sort-btn:active { transform: scale(.96); }

/* Collapsible library drawer */
.library-rail {
    position: fixed; z-index: 30; left: 0; top: 150px; bottom: 0; width: var(--rail-width);
    display: flex; justify-content: flex-start; align-items: flex-start; padding-top: 18px;
    background: rgba(9,11,22,.72); border-right: 1px solid rgba(139,92,246,.18);
    backdrop-filter: blur(16px);
}
.drawer-toggle {
    width: 38px; height: 42px; margin: 0 auto; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid rgba(139,92,246,.24);
    background: rgba(139,92,246,.12); color: #e8e2ff; cursor: pointer;
    font-size: 24px; line-height: 1; transition: transform .28s ease, background .2s, box-shadow .2s;
}
.drawer-toggle:hover { background: rgba(139,92,246,.26); box-shadow: 0 0 22px rgba(139,92,246,.17); }
.library-drawer {
    position: fixed; z-index: 29; top: 150px; bottom: 0; left: var(--rail-width);
    width: var(--sidebar-width); padding: 24px 14px;
    background: var(--panel-strong); border-right: 1px solid rgba(139,92,246,.25);
    box-shadow: 18px 0 55px rgba(0,0,0,.35);
    backdrop-filter: blur(22px);
    transform: translateX(-100%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 7px;
}
.library-drawer.open { transform: translateX(0); }
.library-drawer.open .drawer-toggle { transform: rotate(180deg); }
.drawer-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 7px 16px; }
.drawer-title { font-size: 12px; font-weight: 700; letter-spacing: .19em; color: #b7a5ff; white-space: nowrap; }
.drawer-hint { font-size: 10px; color: #727b98; white-space: nowrap; }
.category-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.category {
    width: 100%; flex-shrink: 0; text-align: left; padding: 12px 13px;
    border: 1px solid transparent; border-radius: 10px; background: transparent;
    color: var(--muted); cursor: pointer; white-space: nowrap;
    transition: color .2s, background .2s, border-color .2s, transform .2s;
}
.category:hover { color: #fff; background: rgba(139,92,246,.1); transform: translateX(2px); }
.category.active {
    color: #fff; background: linear-gradient(100deg, rgba(139,92,246,.23), rgba(34,211,238,.055));
    border-color: rgba(139,92,246,.3); box-shadow: inset 3px 0 var(--purple);
}
.drawer-backdrop { display: none; }

/* Games grid */
.grid {
    height: calc(100vh - 150px); width: 100%; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, 160px);
    justify-content: center; align-content: start; gap: 22px;
    padding: 30px 28px 44px 78px;
    transition: padding .32s ease;
}
.grid::-webkit-scrollbar, .category-list::-webkit-scrollbar { width: 7px; }
.grid::-webkit-scrollbar-thumb, .category-list::-webkit-scrollbar-thumb { background: rgba(139,92,246,.65); border-radius: 20px; }
.card {
    width: 160px; height: 160px; position: relative; overflow: hidden; cursor: pointer;
    border-radius: 17px; background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.075);
    box-shadow: 0 5px 18px rgba(0,0,0,.14);
    transform: translateZ(0);
    transition: transform .28s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .28s;
}
.card:hover {
    transform: translateY(-5px) scale(1.035);
    border-color: rgba(167,139,250,.48);
    box-shadow: 0 16px 34px rgba(0,0,0,.35), 0 0 24px rgba(139,92,246,.13);
}
.card img, .card video {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .3s;
}
.card:hover img, .card:hover video { transform: scale(1.06); }
.card .title {
    position: absolute; inset: auto 0 0; padding: 28px 10px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.9));
    font-size: 13px; font-weight: 550; overflow-wrap: anywhere;
}
.fav {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px;
    display: grid; place-items: center; border-radius: 9px;
    background: rgba(5,6,10,.7); backdrop-filter: blur(8px);
    color: #d1d5db; font-size: 20px; border: 1px solid rgba(255,255,255,.1);
    cursor: pointer; transition: color .2s, transform .2s, background .2s;
}
.fav:hover { transform: scale(1.08); }
.fav.active { color: #facc15; }
.empty-message { grid-column: 1 / -1; text-align: center; color: #9299b0; padding: 52px 15px; }

/* Game overlay */
#overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    justify-content: center; align-items: center; padding: 2.5%;
    background: rgba(0,0,0,.84); backdrop-filter: blur(10px);
    animation: fadeIn .18s ease-out;
}
.window {
    width: 100%; height: 100%; background: #0c0f18;
    border: 1px solid rgba(139,92,246,.28); border-radius: 15px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 25px 100px rgba(0,0,0,.5);
}
.topbar { min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(21,26,42,.98); }
#title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.close-btn {
    min-width: 38px; height: 34px; padding: 0 11px; border-radius: 9px;
    background: rgba(255,255,255,.07); color: white; border: 1px solid rgba(255,255,255,.06); cursor: pointer;
    transition: background .2s, transform .2s;
}
.close-btn:hover { background: rgba(139,92,246,.35); }
.close-btn.exit:hover { background: #dc3b52; }
iframe { flex: 1; width: 100%; border: 0; background: #080a12; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 600px) {
    header { height: 145px; }
    .library-rail { top: 145px; }
    .library-drawer { top: 145px; width: min(250px, calc(100vw - var(--rail-width))); }
    .grid { height: calc(100vh - 145px); grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 13px; padding: 18px 12px 30px 64px; }
    .card { width: 100%; height: auto; aspect-ratio: 1; }
    #search { width: min(270px, 66vw); }
    #overlay { padding: 0; }
    .window { border-radius: 0; }
    .close-btn { padding: 0 8px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header>
    <h1>Galactic Games</h1>
    <div class="controls">
        <input id="search" type="search" placeholder="Search games..." autocomplete="off" aria-label="Search games">
        <button class="sort-btn" id="sortBtn" type="button">A-Z</button>
    </div>
</header>

<!-- The slim left rail stays visible; the separate library drawer slides out beside it. -->
<div class="library-rail" id="libraryRail">
    <button class="drawer-toggle" id="drawerToggle" type="button" aria-label="Open game library" aria-expanded="false" aria-controls="libraryDrawer">›</button>
</div>

<aside class="library-drawer" id="libraryDrawer" aria-label="Game library">
    <div class="drawer-top">
        <div class="drawer-title">GAME LIBRARY</div>
        <div class="drawer-hint">CATEGORIES</div>
    </div>
    <nav class="category-list" aria-label="Game categories">
        <button class="category active" data-category="All" aria-pressed="true">All Games</button>
        <button class="category" data-category="Car Games" aria-pressed="false">Car Games</button>
        <button class="category" data-category="Horror" aria-pressed="false">Horror</button>
        <button class="category" data-category="Sports" aria-pressed="false">Sports</button>
        <button class="category" data-category="Puzzle" aria-pressed="false">Puzzle</button>
        <button class="category" data-category="Adventure" aria-pressed="false">Adventure</button>
        <button class="category" data-category="Platformer" aria-pressed="false">Platformer</button>
        <button class="category" data-category="Multiplayer" aria-pressed="false">Multiplayer</button>
        <button class="category" data-category="Favorites" aria-pressed="false">Favorites</button>
    </nav>
</aside>

<main class="grid" id="grid" aria-live="polite">
    <p class="empty-message">Loading games...</p>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Game player">
    <div class="window">
        <div class="topbar">
            <div id="title">Game</div>
            <button class="close-btn" id="fullscreenBtn" type="button">Fullscreen</button>
            <button class="close-btn exit" id="closeBtn" type="button">Close</button>
        </div>
        <iframe id="frame" allowfullscreen title="Game window"></iframe>
    </div>
</div>

<script>
"use strict";

let games = [];
let sort = "asc";
let activeCategory = "All";
let searchTerm = "";
let drawerPinned = false;
let closeTimer = null;

const grid = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const frame = document.getElementById("frame");
const gameTitle = document.getElementById("title");
const search = document.getElementById("search");
const sortBtn = document.getElementById("sortBtn");
const drawer = document.getElementById("libraryDrawer");
const rail = document.getElementById("libraryRail");
const toggle = document.getElementById("drawerToggle");
const categoryButtons = [...document.querySelectorAll(".category")];

function isDrawerOpen() {
    return drawer.classList.contains("open");
}
function openDrawer() {
    clearTimeout(closeTimer);
    drawer.classList.add("open");
    toggle.setAttribute("aria-expanded", "true");
    toggle.setAttribute("aria-label", drawerPinned ? "Close game library" : "Game library open");
}
function closeDrawer() {
    if (drawerPinned) return;
    drawer.classList.remove("open");
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-label", "Open game library");
}
function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => {
        if (!drawerPinned && !drawer.matches(":hover") && !rail.matches(":hover")) closeDrawer();
    }, 180);
}
rail.addEventListener("mouseenter", openDrawer);
rail.addEventListener("mouseleave", scheduleClose);
drawer.addEventListener("mouseenter", openDrawer);
drawer.addEventListener("mouseleave", scheduleClose);
toggle.addEventListener("click", () => {
    if (isDrawerOpen() && drawerPinned) {
        drawerPinned = false;
        closeDrawer();
    } else if (isDrawerOpen()) {
        drawerPinned = true;
        openDrawer();
    } else {
        drawerPinned = true;
        openDrawer();
    }
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && isDrawerOpen() && !drawerPinned) closeDrawer();
});

/* Favorites */
function getFavs() {
    try {
        const value = JSON.parse(localStorage.getItem("favs"));
        return Array.isArray(value) ? value : [];
    } catch {
        return [];
    }
}
function saveFavs(favorites) {
    try { localStorage.setItem("favs", JSON.stringify(favorites)); }
    catch (error) { console.warn("Favorites could not be saved.", error); }
}
function toggleFav(event, name) {
    event.stopPropagation();
    let favorites = getFavs();
    favorites = favorites.includes(name)
        ? favorites.filter(item => item !== name)
        : [...favorites, name];
    saveFavs(favorites);
    filterGames();
}

/* Sorting and filtering */
sortBtn.addEventListener("click", () => {
    sort = sort === "asc" ? "desc" : "asc";
    sortBtn.textContent = sort === "asc" ? "A-Z" : "Z-A";
    filterGames();
});
function getGameCategories(game) {
    const values = Array.isArray(game.categories) ? game.categories : [game.category || ""];
    return values.map(value => String(value).toLowerCase());
}
function selectCategory(button) {
    activeCategory = button.dataset.category;
    categoryButtons.forEach(item => {
        const active = item === button;
        item.classList.toggle("active", active);
        item.setAttribute("aria-pressed", String(active));
    });
    filterGames();
}
categoryButtons.forEach(button => {
    button.addEventListener("click", () => selectCategory(button));
    button.addEventListener("focus", () => selectCategory(button));
});
function filterGames() {
    const favorites = getFavs();
    const filtered = games.filter(game => {
        const name = String(game.name || "");
        const matchesSearch = name.toLowerCase().includes(searchTerm);
        const matchesCategory = activeCategory === "All" ||
            (activeCategory === "Favorites"
                ? favorites.includes(name)
                : getGameCategories(game).includes(activeCategory.toLowerCase()));
        return matchesSearch && matchesCategory;
    });
    filtered.sort((a, b) => {
        const favOrder = Number(favorites.includes(b.name)) - Number(favorites.includes(a.name));
        if (favOrder) return favOrder;
        return sort === "asc"
            ? String(a.name || "").localeCompare(String(b.name || ""))
            : String(b.name || "").localeCompare(String(a.name || ""));
    });
    render(filtered);
}
search.addEventListener("input", event => {
    searchTerm = event.target.value.toLowerCase().trim();
    filterGames();
});

/* Game cards */
function render(list) {
    grid.replaceChildren();
    if (!list.length) {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "No games found in this section.";
        grid.appendChild(message);
        return;
    }
    const favorites = getFavs();
    list.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", "Play " + game.name);

        if (game.video) {
            const video = document.createElement("video");
            video.src = game.video;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            video.preload = "none";
            card.appendChild(video);
            card.addEventListener("mouseenter", () => video.play().catch(() => {}));
            card.addEventListener("mouseleave", () => video.pause());
        } else {
            const img = document.createElement("img");
            img.alt = game.name || "Game";
            img.loading = "lazy";
            if (game.image) img.src = game.image;
            else {
                img.alt = "";
                img.style.display = "none";
            }
            img.addEventListener("error", () => { img.style.display = "none"; });
            card.appendChild(img);
        }

        const name = document.createElement("div");
        name.className = "title";
        name.textContent = game.name || "Untitled Game";
        card.appendChild(name);

        const favorite = document.createElement("button");
        favorite.type = "button";
        favorite.className = "fav" + (favorites.includes(game.name) ? " active" : "");
        favorite.textContent = favorites.includes(game.name) ? "★" : "☆";
        favorite.setAttribute("aria-label", favorites.includes(game.name) ? "Remove favorite" : "Add favorite");
        favorite.addEventListener("click", event => toggleFav(event, game.name));
        card.appendChild(favorite);

        card.addEventListener("click", () => openGame(game));
        card.addEventListener("keydown", event => {
            if (event.target === card && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                openGame(game);
            }
        });
        grid.appendChild(card);
    });
}

/* Game player */
function openGame(game) {
    if (!game.url) {
        alert("This game does not have a URL.");
        return;
    }
    frame.src = game.url;
    gameTitle.textContent = game.name || "Game";
    overlay.style.display = "flex";
}
function closeGame() {
    overlay.style.display = "none";
    frame.src = "";
}
document.getElementById("closeBtn").addEventListener("click", closeGame);
document.getElementById("fullscreenBtn").addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) await document.querySelector(".window").requestFullscreen();
        else await document.exitFullscreen();
    } catch (error) {
        console.error("Fullscreen unavailable:", error);
    }
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && overlay.style.display === "flex" && !document.fullscreenElement) closeGame();
});

/* Load games from hiddengames.json */
fetch("./hiddengames.json")
    .then(response => {
        if (!response.ok) throw new Error("Could not load hiddengames.json (" + response.status + ")");
        return response.json();
    })
    .then(data => {
        if (!Array.isArray(data)) throw new Error("hiddengames.json must contain a JSON array.");
        games = data.filter(game => game && typeof game === "object" && typeof game.name === "string");
        filterGames();
    })
    .catch(error => {
        console.error("Error loading games:", error);
        grid.replaceChildren();
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "Could not load games. Check hiddengames.json and run the site using a local web server.";
        grid.appendChild(message);
    });

/* Starfield parallax */
const bg = document.getElementById("bg");
const stars = [];
for (let i = 0; i < 120; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    bg.appendChild(star);
    stars.push(star);
}
document.addEventListener("mousemove", event => {
    const x = (event.clientX / window.innerWidth - .5) * 12;
    const y = (event.clientY / window.innerHeight - .5) * 12;
    stars.forEach((star, index) => {
        const factor = index % 3;
        star.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
    });
});
</script>
</body>
</html>
